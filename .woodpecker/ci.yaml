clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, main]
  - event: pull_request
  - event: manual

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender
      POSTGRES_DB: recommender
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0@sha256:0fa01a2b929e704c7a9300d23e7f52002ebd39e90996fb8bb63826aed92fa06f
    commands:
      - dragonfly --logtostderr --proactor_threads=1 --maxmemory=256mb

steps:
  - name: quality
    image: ghcr.io/astral-sh/uv:0.11.7-python3.12-trixie-slim@sha256:760df02ce4a80b395949f5ac7bf9741c5123fb829d9b62092363bfdca0088059
    environment:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      RECOMMENDER_TEST_DATABASE_URL: postgresql://recommender:recommender@postgres:5432/recommender
      RECOMMENDER_TEST_CACHE_URL: redis://cache:6379
    commands:
      - |
        set -eu
        uv sync --frozen
        uv run ruff format --check recommender tests
        uv run ruff check recommender tests
        for attempt in $$(seq 1 60); do
          if uv run python -c "import psycopg, os; psycopg.connect(os.environ['RECOMMENDER_TEST_DATABASE_URL']).close()" 2>/dev/null; then
            break
          fi
          sleep 1
        done
        uv run pytest -q --deselect tests/test_scale.py::test_three_times_the_measured_account_fits_in_a_page
